[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resnet-research"
version = "0.1.0"
description = "From-scratch reproduction and experimental study of Deep Residual Learning for Image Recognition (He et al., 2015) on CIFAR-10"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Sujin Prajapati" }]
keywords = ["resnet", "residual-learning", "cifar10", "pytorch", "reproduction"]

dependencies = [
    "torch>=2.1",
    "torchvision>=0.16",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "torchinfo>=1.8",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]   # so tests can import the scripts/ entry points
filterwarnings = [
    # torchvision's CIFAR loader triggers a numpy 2.4 deprecation; not our code
    "ignore:dtype\\(\\)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
