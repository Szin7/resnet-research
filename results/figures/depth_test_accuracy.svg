<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="820" height="440" viewBox="0 0 820 440" role="img" aria-labelledby="plot-title plot-description">
<title id="plot-title">Test accuracy by network depth</title>
<desc id="plot-description">Best-validation checkpoint on the 10,000-image CIFAR-10 test set. Data from the completed seed-1 eight-model CIFAR-10 experiment; plain and residual networks at depths 20, 32, 44 and 56.</desc>
