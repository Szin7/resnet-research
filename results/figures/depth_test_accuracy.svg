  text{font-family:Arial,Helvetica,sans-serif;fill:#243344}
  .title{font-size:24px;font-weight:700}
  .subtitle{font-size:12.5px;fill:#687585}
  .axis{font-size:13px;fill:#42556b}
  .tick{font-size:13px;fill:#42556b}
  .legend{font-size:13.5px;font-weight:600}
</style>
<rect width="820" height="440" fill="#fff"/>
<text x="42" y="37" class="title">Test accuracy by network depth</text>
