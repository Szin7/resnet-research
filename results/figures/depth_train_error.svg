<polyline points="125.0,319.4 331.7,334.3 538.3,338.0 745.0,340.9" fill="none" stroke="#24628d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="125.0" cy="301.1" r="5.2" fill="#b74940" stroke="#fff" stroke-width="1.7"/><circle cx="331.7" cy="286.0" r="5.2" fill="#b74940" stroke="#fff" stroke-width="1.7"/><circle cx="538.3" cy="255.0" r="5.2" fill="#b74940" stroke="#fff" stroke-width="1.7"/><circle cx="745.0" cy="107.4" r="5.2" fill="#b74940" stroke="#fff" stroke-width="1.7"/><circle cx="125.0" cy="319.4" r="5.2" fill="#24628d" stroke="#fff" stroke-width="1.7"/><circle cx="331.7" cy="334.3" r="5.2" fill="#24628d" stroke="#fff" stroke-width="1.7"/><circle cx="538.3" cy="338.0" r="5.2" fill="#24628d" stroke="#fff" stroke-width="1.7"/><circle cx="745.0" cy="340.9" r="5.2" fill="#24628d" stroke="#fff" stroke-width="1.7"/>
<line x1="145" x2="178" y1="83" y2="83" stroke="#b74940" stroke-width="3"/>
<circle cx="162" cy="83" r="4.5" fill="#b74940"/>
