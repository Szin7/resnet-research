<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="820" height="440" viewBox="0 0 820 440" role="img" aria-labelledby="plot-title plot-description">
<title id="plot-title">Training error by network depth</title>
<desc id="plot-description">Final-epoch training error; lower is better. Data from the completed seed-1 eight-model CIFAR-10 experiment; plain and residual networks at depths 20, 32, 44 and 56.</desc>
<style>
  text{font-family:Arial,Helvetica,sans-serif;fill:#243344}
  .title{font-size:24px;font-weight:700}
  .subtitle{font-size:12.5px;fill:#687585}
  .axis{font-size:13px;fill:#42556b}
  .tick{font-size:13px;fill:#42556b}
  .legend{font-size:13.5px;font-weight:600}
</style>
<rect width="820" height="440" fill="#fff"/>
<text x="42" y="37" class="title">Training error by network depth</text>
<text x="42" y="58" class="subtitle">Final-epoch training error; lower is better</text>
<line x1="125" x2="745" y1="354" y2="354" stroke="#506276" stroke-width="1.25"/>
<line x1="125" x2="125" y1="76" y2="354" stroke="#506276" stroke-width="1.25"/>
<line x1="125" x2="745" y1="354.00" y2="354.00" stroke="#dce3e9" stroke-width="1"/><text x="108" y="359" text-anchor="end" class="tick">0%</text><line x1="125" x2="745" y1="290.82" y2="290.82" stroke="#dce3e9" stroke-width="1"/><text x="108" y="295.8181818181818" text-anchor="end" class="tick">5%</text><line x1="125" x2="745" y1="227.64" y2="227.64" stroke="#dce3e9" stroke-width="1"/><text x="108" y="232.63636363636363" text-anchor="end" class="tick">10%</text><line x1="125" x2="745" y1="164.45" y2="164.45" stroke="#dce3e9" stroke-width="1"/><text x="108" y="169.45454545454547" text-anchor="end" class="tick">15%</text><line x1="125" x2="745" y1="101.27" y2="101.27" stroke="#dce3e9" stroke-width="1"/><text x="108" y="106.27272727272728" text-anchor="end" class="tick">20%</text><line x1="125" x2="125" y1="354" y2="359" stroke="#697785"/><text x="125" y="381" text-anchor="middle" class="tick">20</text><line x1="331.66666666666663" x2="331.66666666666663" y1="354" y2="359" stroke="#697785"/><text x="331.66666666666663" y="381" text-anchor="middle" class="tick">32</text><line x1="538.3333333333333" x2="538.3333333333333" y1="354" y2="359" stroke="#697785"/><text x="538.3333333333333" y="381" text-anchor="middle" class="tick">44</text><line x1="745" x2="745" y1="354" y2="359" stroke="#697785"/><text x="745" y="381" text-anchor="middle" class="tick">56</text>
